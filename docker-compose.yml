
services:
  # ---- MySQL 8 database ----
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Python backend (Playwright + AI pipeline) ----
  backend:
    build: ./backend
    env_file: .env.local
    command: ["app.services.worker"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/tests/tickets:/app/app/tests/tickets:ro
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  mysql_data:
