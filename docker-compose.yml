
services:
  # ---- MySQL 8 database ----
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.local
    environment:
      MYSQL_TCP_PORT: 6446
    ports:
      - "6446:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3306"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Python backend (Flask API + Playwright pipeline) ----
  backend:
    build: ./backend
    env_file: .env.local
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
    environment:
      FLASK_APP: app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/tests/tickets:/app/app/tests/tickets:ro
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  mysql_data:
