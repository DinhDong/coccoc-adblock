
services:
  # ---- MySQL 8 database ----
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Deliberately NOT env_file: .env.local. That file carries the shared
    # server's MYSQL_HOST/USER/PASSWORD, which this container would take as
    # its own identity — and its mysql client would then try to reach the
    # remote host instead of itself. These are throwaway local-dev values,
    # the same ones documented in .env.example.
    environment:
      MYSQL_ROOT_PASSWORD: adblock_root
      MYSQL_DATABASE: adblock
      MYSQL_USER: adblock
      MYSQL_PASSWORD: adblock_pass
    ports:
      - "6446:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3306"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Python backend (Flask API — debug mode) ----
  backend:
    build: ./backend
    env_file: .env.local
    # Matches:  python -m flask --debug run --host 0.0.0.0 --port 5000
    # The Dockerfile's CMD already does this, but we keep it explicit here
    # so it's easy to see / override.
    command: ["python", "-m", "flask", "--debug", "run", "--host=0.0.0.0", "--port=5000"]
    environment:
      FLASK_APP: app
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./backend:/app            # live-reload: edits on host → reflected in container
      - /app/.venv                # prevent host .venv from shadowing the container's packages
      - ./backend/data:/app/data
      - ./backend/app/tests/tickets:/app/app/tests/tickets:ro
    deploy:
      resources:
        limits:
          memory: 4G

  # ---- FastAPI upload / presigned-URL API ----
  api:
    build: ./backend
    env_file: .env.local
    entrypoint: ["uvicorn"]
    command: ["app.api:app", "--host=0.0.0.0", "--port=8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  # ---- React + Vite frontend (dev server with HMR) ----
  frontend:
    build:
      context: ./frontend
      target: dev                   # uses the "dev" stage in the multi-stage Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app            # live-reload: edits on host → reflected in container
      - /app/node_modules          # prevent host node_modules from shadowing the container's
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G

  # ---- Background worker (poll for "new" tickets every 5 seconds) ----
  worker:
    build: ./backend
    env_file: .env.local
    command: ["python", "scripts/run_worker.py"]
    environment:
      WORKER_LOG_LEVEL: INFO
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/data:/app/data
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  mysql_data:
