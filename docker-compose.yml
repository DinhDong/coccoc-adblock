
services:
  # ---- MySQL 8 database ----
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Deliberately NOT env_file: .env.local. That file carries the shared
    # server's MYSQL_HOST/USER/PASSWORD, which this container would take as
    # its own identity — and its mysql client would then try to reach the
    # remote host instead of itself. These are throwaway local-dev values,
    # the same ones documented in .env.example.
    environment:
      MYSQL_ROOT_PASSWORD: adblock_root
      MYSQL_DATABASE: adblock
      MYSQL_USER: adblock
      MYSQL_PASSWORD: adblock_pass
    ports:
      - "6446:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3306"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Python backend (Flask API + Playwright pipeline) ----
  backend:
    build: ./backend
    env_file: .env.local
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
    environment:
      FLASK_APP: app
      # These override the MySQL settings coming from .env.local. Inside the
      # compose network the database is the `db` service; the shared server's
      # address in .env.local is a corporate-LAN host that Docker's network
      # cannot route to, so leaving it in place makes every request time out.
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: adblock
      MYSQL_USER: adblock
      MYSQL_PASSWORD: adblock_pass
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./backend/app/tests/tickets:/app/app/tests/tickets:ro
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  mysql_data:
