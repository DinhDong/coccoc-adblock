# ==========================================================================
# docker-compose.yml — AdBlock Rule Engine Generator
#
# Usage:
#   docker compose up --build -d          # start MySQL
#   docker compose run --rm backend app.services.workflow <report_id> --url <url> --env desktop
#   docker compose run --rm backend app.services.workflow <report_id>
#   docker compose run --rm backend app.services.crawler <url> <id> --env desktop
#   docker compose run --rm backend app.services.crawler <url> <id> --focus "header"
#   docker compose run --rm backend app.services.crawler <url> <id> --focus "right sidebar"
#   docker compose run --rm backend app.services.crawler <url> <id> --focus "top banner area"
#
#   docker compose run --rm backend app.validator.rule_preview <url> "<rule>"
#   docker compose run --rm backend app.validator.rule_preview <url> --rules-file rules.txt --env android
#   docker compose run --rm backend app.validator.rule_preview <url> "<rule>" --out data/previews/motp
#
#   docker compose run --rm backend pytest app/tests/ -v
#   docker compose down                   # stop; data preserved
#   docker compose down -v                # stop + delete MySQL data
#
# Outputs land in ./backend/data (bind-mounted, so they survive the container):
#   data/rule_outputs/results/<report_id>_rules.json
#   data/rule_outputs/validation/<report_id>_validation.json
#   data/rule_outputs/screenshots/<report_id>_before.png         # clean reference page
#   data/rule_outputs/screenshots/<report_id>_before_boxed.png   # + boxes drawn, with legend
#   data/rule_outputs/screenshots/<report_id>_with_rules.png     # all passing rules applied
#
# The validation JSON carries preview_capture plus a per-rule preview block of
# bounding boxes measured against _before.png, for the moderator CMS overlays.
# _before_boxed.png is a convenience render of those boxes; re-render it for any
# finished report without re-running the pipeline:
#   docker compose run --rm backend app.validator.preview_render <report_id>
# ==========================================================================

services:

  # ------------------------------------------------------------------------
  # Local MySQL 8 database
  # ------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped

    env_file:
      - .env.local

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ------------------------------------------------------------------------
  # Python crawler / AI pipeline
  #
  # This service keeps the Dockerfile's default entrypoint:
  #   python -m
  #
  # It is normally invoked with:
  #   docker compose run --rm backend <python-module> <arguments>
  # ------------------------------------------------------------------------
  backend:
    build:
      context: ./backend

    env_file:
      - .env.local

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend/data:/app/data

    deploy:
      resources:
        limits:
          memory: 4G


  # ------------------------------------------------------------------------
  # Ceph image upload API
  #
  # Endpoint:
  #   POST /api/v1/images
  #
  # Health:
  #   GET /health
  #
  # Swagger documentation:
  #   GET /docs
  #
  # This service overrides the Dockerfile entrypoint "python -m" and starts
  # Uvicorn directly.
  # ------------------------------------------------------------------------
  api:
    build:
      context: ./backend

    env_file:
      - .env.local

    entrypoint:
      - uvicorn

    command:
      - app.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health',
          timeout=5
          )
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 1G


volumes:
  mysql_data: